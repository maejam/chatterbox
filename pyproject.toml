[project]
name = "chatterbox-tts"
version = "0.1.7"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    "conformer>=0.3.2",
    "diffusers>=0.40.0",
    "librosa>=0.11.0",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "pykakasi>=2.3.0",
    "pyloudnorm>=0.2.0",
    "resemble-perth>=1.0.1",
    "s3tokenizer>=0.3.0",
    "safetensors>=0.8.0",
    "spacy-pkuseg>=1.0.1",
    "torch==2.6.0; python_version < '3.14'",
    "torch>=2.9.0; python_version >= '3.14'",
    "torchaudio==2.6.0; python_version < '3.14'",
    "torchaudio>=2.9.0; python_version >= '3.14'",
    "transformers>=5.17.0",
]

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox"
Repository = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
